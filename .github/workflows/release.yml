# Сборка плагина и релиз после каждой правки в main.
# Панель в Premiere сама находит новый релиз и обновляется одной кнопкой
# (файл index.js из релиза). Для первой установки — premiere-assistant.ccx.
name: Сборка и релиз плагина

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Номер версии
        id: v
        run: echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Сборка панели
        env:
          PANEL_VERSION: ${{ steps.v.outputs.version }}
          PANEL_UPDATE_REPO: ${{ github.repository }}
        run: npm run build:panel

      - name: Версия в manifest и упаковка .ccx
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node -e "const fs=require('fs');const f='packages/panel-premiere/dist/manifest.json';const m=JSON.parse(fs.readFileSync(f,'utf8'));m.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(m,null,2))"
          cd packages/panel-premiere/dist
          zip -r -q ../../../premiere-assistant.ccx . -x '*.map'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Нажиматель клавиш (программа для Windows, значок в трее; с v8 — и нейросеть удаления фона, cgo)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64
          cd tools/keys-app
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -trimpath -ldflags "-H windowsgui -s -w" -o ../../premiere-assistant-keys.exe .

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" \
            premiere-assistant.ccx \
            packages/panel-premiere/dist/index.js \
            premiere-assistant-keys.exe \
            --title "v$VERSION" \
            --notes "${NOTES:-Сборка $VERSION}"

  # Mac (Apple Silicon): помощник как приложение .app + whisper-cli с Metal. Отдельно от основного релиза:
  # если сборка для Mac упадёт, обновление панели для всех всё равно выйдет.
  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Номер версии
        id: v
        run: echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Помощник для Mac (.app)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd tools/keys-app
          go vet ./...
          go test ./...
          APP="Premiere Assistant Helper.app"
          mkdir -p "$APP/Contents/MacOS"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "$APP/Contents/MacOS/premiere-assistant-helper" .
          sed "s/__VERSION__/$VERSION/g" macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          codesign --verify --verbose "$APP"
          ditto -c -k --keepParent "$APP" ../../PremiereAssistantHelper-mac.zip

      - name: whisper.cpp из кэша
        id: wcache
        uses: actions/cache@v4
        with:
          path: whisper-cli-macos-arm64
          key: whisper-cli-macos-arm64-v1.9.0

      - name: whisper-cli для Mac (Metal, без внешних библиотек)
        if: steps.wcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.9.0 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B wb -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF
          cmake --build wb --target whisper-cli -j 4
          cp wb/bin/whisper-cli whisper-cli-macos-arm64
          otool -L whisper-cli-macos-arm64
          codesign --force -s - whisper-cli-macos-arm64

      - name: Добавить в релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release upload "v$VERSION" PremiereAssistantHelper-mac.zip whisper-cli-macos-arm64 --clobber
