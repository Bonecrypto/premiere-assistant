# Сборка плагина и релиз после каждой правки в main.
# Панель в Premiere сама находит новый релиз и обновляется одной кнопкой
# (файл index.js из релиза). Для первой установки — premiere-assistant.ccx.
name: Сборка и релиз плагина

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Номер версии
        id: v
        run: echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Сборка панели
        env:
          PANEL_VERSION: ${{ steps.v.outputs.version }}
          PANEL_UPDATE_REPO: ${{ github.repository }}
        run: npm run build:panel

      - name: Версия в manifest и упаковка .ccx
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node -e "const fs=require('fs');const f='packages/panel-premiere/dist/manifest.json';const m=JSON.parse(fs.readFileSync(f,'utf8'));m.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(m,null,2))"
          cd packages/panel-premiere/dist
          zip -r -q ../../../premiere-assistant.ccx . -x '*.map'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Нажиматель клавиш (программа для Windows, значок в трее; с v8 — и нейросеть удаления фона, cgo)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64
          cd tools/keys-app
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -trimpath -ldflags "-H windowsgui -s -w" -o ../../premiere-assistant-keys.exe .

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" \
            premiere-assistant.ccx \
            packages/panel-premiere/dist/index.js \
            premiere-assistant-keys.exe \
            --title "v$VERSION" \
            --notes "${NOTES:-Сборка $VERSION}"
